<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcript Cleaner</title>
<link rel="icon" href="/favicon.ico">
<style>
:root {
  /* four clearly separate layers: page < card < inset, plus a stronger edge for anything you can click or type in */
  --bg: #e8ebf0; --panel: #ffffff; --panel-2: #f1f3f7; --line: #d2d7df; --line-strong: #9ea6b3; --text: #161a1f; --muted: #47505c;
  --accent: #2563d9; --accent-soft: #e3ecfc; --green: #136b43; --green-soft: #dcf2e6; --amber: #7d5106;
  --amber-soft: #fbecd0; --red: #a8332a; --red-soft: #fbe6e3; --mark: #ffe17a; --shadow: 0 1px 2px rgba(16,24,40,.08), 0 3px 10px rgba(16,24,40,.06);
  --link: color-mix(in srgb, var(--accent-fg) 70%, var(--text));
  --accent-fg: var(--accent); --accent-edge: var(--accent); --line-soft: var(--line);
  --radius: 10px; --radius-btn: 8px; --radius-input: 8px; --accent-text: #ffffff;
  --heading-weight: 650; --tracking: normal; --h1-size: 22px; --row-pad: 11px; --pad-card: 18px; --gap: 20px;
  --btn-weight: 500; --btn-pad: 7px 14px; --label-transform: none; --label-tracking: normal;
  --shadow-float: 0 20px 60px rgba(0,0,0,.25);
  --font-body: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-heading: var(--font-body); --font-reading: var(--font-body);
  font-family: var(--font-body); color-scheme: light;
}
/* dark: chosen in the sidebar, or "Auto" while the computer is in dark mode */
:root[data-mode="dark"] { --bg: #090b0e; --panel: #171b21; --panel-2: #20252d; --line: #353d49; --line-strong: #5d6878; --text: #edf0f4; --muted: #b4bcc7;
  --accent: #6ea0ff; --accent-soft: #1d2b44; --accent-text: #0b1220; --green: #4cc38a; --green-soft: #15302a; --amber: #e3a646;
  --amber-soft: #352914; --red: #ef7a70; --red-soft: #3a1f1d; --mark: #6b5a17; --shadow: none; color-scheme: dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-mode="light"]) { --bg: #090b0e; --panel: #171b21; --panel-2: #20252d; --line: #353d49; --line-strong: #5d6878; --text: #edf0f4; --muted: #b4bcc7;
    --accent: #6ea0ff; --accent-soft: #1d2b44; --accent-text: #0b1220; --green: #4cc38a; --green-soft: #15302a; --amber: #e3a646;
    --amber-soft: #352914; --red: #ef7a70; --red-soft: #3a1f1d; --mark: #6b5a17; --shadow: none; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-size: 14px; font-family: var(--font-body); letter-spacing: var(--tracking); }
h1, h2, .rcard .who, .theme-card .tname { font-weight: var(--heading-weight); letter-spacing: normal; }
pre.doc, .code, input, textarea { letter-spacing: normal; }
.colhead, .rcard .kind, .list-tools > .tag, .answers .tag { text-transform: var(--label-transform); letter-spacing: var(--label-tracking); }
h1, h2, .brand, .rcard .who, .theme-card .tname { font-family: var(--font-heading); }
button, input, select, textarea { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; font-weight: 650; font-size: 15px; }
.brand svg { color: var(--accent-fg); }
nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 9px 10px;
  border-radius: 8px; cursor: pointer; color: var(--muted); text-align: left; }
nav button:hover { background: var(--panel-2); color: var(--text); }
nav button.on { background: var(--accent-soft); color: var(--text); font-weight: 600; }
nav button.on svg { color: var(--accent-fg); }
nav .count { margin-left: auto; font-size: 12px; background: var(--panel-2); color: var(--muted); border-radius: 999px; padding: 1px 8px; }
nav button.on .count { background: var(--panel); }
nav .count.alert { background: var(--amber-soft); color: var(--amber); font-weight: 600; }
.local { margin-top: auto; font-size: 12px; color: var(--muted); display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); line-height: 1.4; }
main { overflow: auto; padding: 26px 32px 60px; }
h1 { font-size: var(--h1-size); margin: 0 0 4px; line-height: 1.15; }
.sub { color: var(--muted); margin: 0 0 20px; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.drop { border: 2px dashed var(--line-strong); border-radius: var(--radius); padding: 26px; text-align: center; background: var(--panel);
  transition: border-color .15s, background .15s; margin-bottom: 20px; }
.drop.over { border-color: var(--accent-edge); background: var(--accent-soft); }
.drop strong { display: block; font-size: 15px; margin-bottom: 4px; }
.drop .muted { margin-bottom: 12px; }
.export-destination {display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;margin-bottom:20px}
.export-destination.needs-setup {background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}
.dest-icon {flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--link)}
.needs-setup .dest-icon, .needs-setup .chip {background:var(--panel);color:var(--amber)}
.export-destination .destination-info {min-width:0;flex:1}
.export-destination h2 {font-size:15px;margin:0 0 7px}
.export-destination .export-path {font-size:13px;overflow-wrap:anywhere;line-height:1.5}
.export-destination .hint {margin-top:7px;line-height:1.5}
.export-destination .actions {flex:none}
.sample-preview {max-width:760px;margin:16px auto 0;text-align:center}
.sample-preview summary {cursor:pointer;color:var(--muted);display:inline-block;padding:4px 8px;border-radius:6px}
.sample-preview summary:hover {color:var(--text);background:var(--panel-2)}
.sample-preview summary::-webkit-details-marker {display:none}
.sample-preview summary::before {content:"\25B8";display:inline-block;margin-right:6px;transition:transform .15s}
.sample-preview[open] summary::before {transform:rotate(90deg)}
@media (prefers-reduced-motion: reduce) { .sample-preview summary::before {transition:none} }
.sample-preview pre.doc {text-align:left}
.sample-preview pre.doc {margin-top:10px;height:auto;min-height:0;max-height:240px}
.workspace-banner {margin-bottom:20px}
@media(max-width:700px){.export-destination{align-items:stretch;flex-direction:column;gap:12px}.export-destination .actions{align-self:flex-start}}
.muted { color: var(--muted); }
.btn { border: 1px solid var(--line-strong); background: var(--panel); padding: var(--btn-pad); font-weight: var(--btn-weight); border-radius: var(--radius-btn); cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent-edge); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--red); border-color: var(--red-soft); }
.rename-form { display: flex; gap: 6px; align-items: center; }
.rename-form input { flex: 1; min-width: 0; padding: 4px 10px; }
.icon-btn.small-trash { width: 28px; height: 28px; font-size: 14px; display: inline-grid; place-items: center; }
.icon-btn.row-act { width: 28px; height: 28px; display: inline-grid; place-items: center; flex: none; }
.icon-btn.row-act[data-rename]:hover { color: var(--accent-fg); background: var(--accent-soft); }
.icon-btn.small-trash:hover { color: var(--red); background: var(--red-soft); }
.dl { align-items: center; }
.btn.danger:hover { background: var(--red-soft); }
.btn:disabled { opacity: .55; cursor: default; }
.row-list { display: flex; flex-direction: column; }
.row { display: grid; align-items: center; gap: 14px; padding: var(--row-pad) 16px; border-top: 1px solid var(--line-soft); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--panel-2); }
.row.sel { background: var(--accent-soft); }
.calls .row, .calls .colhead { grid-template-columns: minmax(150px, 1.5fr) 124px minmax(90px, 1.2fr) 272px; }
.when { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 400; }
.calls .row .name { display: block; }
.calls.compact .row, .calls.compact .colhead { grid-template-columns: minmax(130px, 1.4fr) 132px minmax(80px, 1fr); }
.calls.compact .row > :nth-child(4), .calls.compact .colhead > :nth-child(4) { display: none; }
@media (max-width: 1000px) { .calls .row, .calls .colhead { grid-template-columns: minmax(130px, 1.5fr) 124px minmax(80px, 1fr) 152px; } .dl .txt { display: none; } }
.dl { display: flex; gap: 6px; }
.code.person { font-variant-numeric: normal; color: var(--text); background: var(--panel-2); }
.list-tools { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 8px; }
.people .row, .people .colhead { grid-template-columns: 64px minmax(130px, 1.3fr) minmax(110px, 1fr) 44px; }
.cos .row, .cos .colhead { grid-template-columns: 64px minmax(150px, 1.6fr) 60px 44px; }
.row .name { font-weight: 550; line-height: 1.35; min-width: 0; }
.calls .row .name { overflow-wrap: anywhere; }
.row > span { min-width: 0; }
.panel h2 { font-size: 15px; overflow-wrap: anywhere; }
.colhead { display: grid; gap: 14px; padding: 10px 16px; font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--panel-2); border-bottom: 1px solid var(--line); border-radius: calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0; }
.row .btn, .row .icon-btn { border-color: transparent; background: transparent; }
.row .btn { color: var(--link); font-weight: 600; }
.row .btn:hover, .row .icon-btn:hover { background: var(--panel); border-color: var(--line-strong); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.chip.clean { background: var(--green-soft); color: var(--green); } .chip.clean .dot { background: var(--green); }
.chip.held { background: var(--amber-soft); color: var(--amber); } .chip.held .dot { background: var(--amber); }
.code { font-variant-numeric: tabular-nums; font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.codes { display: flex; gap: 6px; flex-wrap: wrap; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { padding: var(--pad-card); }
.panel h2 { font-size: 16px; margin: 0 0 4px; }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 550; }
pre.doc { white-space: pre-wrap; word-wrap: break-word; font: 13px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace;
  background: var(--panel-2); border-radius: 8px; padding: 14px; margin: 12px 0 0; height: 52vh; overflow: auto; }
.note.approve-row { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.restore-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.restore-grid textarea { width: 100%; min-height: 280px; margin-top: 10px; font-family: var(--font-reading); font-size: 15px; line-height: 1.6; }
.restore-out { min-height: 280px; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-input); background: var(--panel-2);
  white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-reading); font-size: 15px; line-height: 1.6; }
.restore-out.empty-out { color: var(--muted); }
.restore-out mark { border-radius: 3px; padding: 0 2px; color: var(--text); }
.restore-out mark.rs-restored { background: var(--green-soft); box-shadow: inset 0 -2px 0 var(--green); }
#team-text { width: 100%; }
.team-preview { margin-top: 12px; }
.team-st { font-size: 13px; font-weight: 600; white-space: nowrap; }
.team-st.st-new { color: var(--green); }
.team-st.st-have { color: var(--muted); }
.team-st.st-client { color: var(--amber); }
.restore-out mark.rs-unknown, .restore-out mark.rs-hidden { background: var(--amber-soft); box-shadow: inset 0 -2px 0 var(--amber); }
.agent-note { font-family: var(--font-reading); color: var(--text); }
@media (max-width: 1000px) { .restore-grid { grid-template-columns: minmax(0, 1fr); } }
.rv .head .btn { flex: none; }
.rv-owner { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 16px; }
.rv-owner input { min-width: 240px; }
.rv-list, .rv-once { padding: 0; overflow: hidden; }
.rv-once { margin-top: 16px; }
.rv-once > summary { cursor: pointer; padding: 14px 18px; font-weight: 600; background: var(--panel-2); }
.rv-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line-soft); }
.rv-list .rv-row:first-child { border-top: 0; }
.rv-call { margin-bottom: 16px; }
.rv-call-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.rv-call-head .hint { display: block; margin-top: 2px; }
.rv-call-title { margin: 0; font-size: 17px; font-weight: 700; color: var(--text); overflow-wrap: anywhere; }
.rv-call-count { color: var(--muted); font-size: 14px; white-space: nowrap; }
.rv-call-head + .rv-row { border-top: 0; }
.rv-progress { margin: 0 0 16px; padding: 14px 18px; }
.rv-progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.rv-progress-top b { font-size: 17px; color: var(--text); }
.rv-progress-top span { color: var(--muted); font-size: 14px; }
.rv-bar { height: 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.rv-bar > span { display: block; height: 100%; border-radius: 999px; background: var(--green); transition: width .45s ease; }
@media (prefers-reduced-motion: reduce) { .rv-bar > span { transition: none; } }
.rv-row.editing { background: var(--panel-2); }
.rv-name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15.5px; }
.rv-name .chip { font-size: 12.5px; }
.chip.rv-speaker { background: var(--accent-soft); color: var(--text); }
.chip.k-tool { background: var(--panel-2); color: var(--text); } .chip.k-tool .dot { background: var(--muted); }
.rv-meta { margin-top: 3px; font-size: 13px; color: var(--muted); }
.rv-meta .code { font-size: 12px; }
.rv-where { padding: 0; font-size: 13px; }
.rv-actions { justify-content: flex-end; }
.rv-context, .rv-edit { grid-column: 1 / -1; }
.rv-context .excerpt { margin-top: 4px; }
.rv-edit .identity-editor { margin-top: 4px; }
.status-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rv-tag { border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent); background: var(--amber-soft); color: var(--amber); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.rv-tag:hover { border-color: var(--amber); }
.rv-tag:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
@media (max-width: 900px) { .rv-row { grid-template-columns: minmax(0, 1fr); } .rv-actions { justify-content: flex-start; } }
.suggest-card { margin-bottom: 20px; }
.sg-list { display: flex; flex-direction: column; margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius-input); }
.sg-row { display: grid; grid-template-columns: 20px minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: end; padding: 10px 12px; border-top: 1px solid var(--line-soft); }
.sg-row:first-child { border-top: 0; }
.sg-row > input[type=checkbox] { width: 16px; height: 16px; margin-bottom: 10px; accent-color: var(--accent-fg); }
.sg-row input:not([type=checkbox]) { width: 100%; }
.sg-email { font-size: 13px; color: var(--muted); padding-bottom: 9px; overflow-wrap: anywhere; }
.bulk-table { margin-top: 14px; border: 1px solid var(--line); border-radius: var(--radius-input); }
.bulk-row { display: grid; grid-template-columns: 20px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, .9fr) 120px; gap: 12px; align-items: center;
  padding: 9px 12px; border-top: 1px solid var(--line-soft); flex-direction: row; color: var(--text); font-size: 13.5px; }
.bulk-row:first-child { border-top: 0; }
.bulk-head { background: var(--panel-2); font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: var(--radius-input) var(--radius-input) 0 0; }
.bulk-row input { width: 16px; height: 16px; accent-color: var(--accent-fg); }
.bulk-row > span { min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 900px) { .sg-row { grid-template-columns: 20px minmax(0, 1fr); } .sg-row > :nth-child(n+3) { grid-column: 2; }
  .bulk-row { grid-template-columns: 20px minmax(0, 1fr) 110px; } .bulk-row > :nth-child(3), .bulk-row > :nth-child(4), .bulk-row > :nth-child(5) { display: none; } }
.final-check { margin-top: 12px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.final-check.ok { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 35%, var(--line)); }
.fc-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.fc-title { font-size: 17px; }
.fc-sub { color: var(--text); font-size: 14px; }
.fc-q { font-size: 16px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
.fc-label { margin-top: 8px; font-size: 13px; color: var(--muted); }
.fc-row { padding: 14px 0; border-top: 1px solid var(--line-soft); }
.fc-row:first-of-type { border-top: 0; }
.fc-ctx { font-family: var(--font-reading); font-size: 15px; line-height: 1.6; margin: 4px 0 10px; padding: 6px 0 6px 12px; border-left: 3px solid var(--line-strong); color: var(--text); overflow-wrap: anywhere; }
.fc-ctx mark { background: var(--mark); color: var(--text); border-radius: 3px; padding: 0 3px; font-weight: 600; }
.tok { background: var(--accent-soft); color: var(--accent-fg); border-radius: 4px; padding: 0 3px; font-weight: 600; }
.note { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: var(--panel-2); margin-top: 12px; line-height: 1.5; }
.note.warn { background: var(--amber-soft); color: var(--amber); }
.note.bad { background: var(--red-soft); color: var(--red); }
/* needs you: one column, one question per card, read top to bottom. Larger type and stronger contrast than the
   rest of the app, because this is where people read most closely. */
.ny { max-width: 920px; }
.ny, .identity-editor { --ny-soft: color-mix(in srgb, var(--text) 78%, var(--panel)); --ny-link: color-mix(in srgb, var(--accent-fg) 62%, var(--text)); }
.ny .sub { color: var(--ny-soft); font-size: 14.5px; }
.review { display: flex; flex-direction: column; gap: 18px; }
.rcard { padding: 24px 26px 22px; }
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 12px; }
.q-where { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ny-soft); min-width: 0; overflow-wrap: anywhere; }
.q-where svg, .gc-file svg { flex: none; }
.chip.k-person { background: var(--accent-soft); color: var(--text); } .chip.k-person .dot { background: var(--accent-fg); }
.chip.k-company { background: var(--green-soft); color: var(--text); } .chip.k-company .dot { background: var(--green); }
.chip.k-which { background: var(--amber-soft); color: var(--text); } .chip.k-which .dot { background: var(--amber); }
.rcard .chip { font-size: 13px; font-weight: 600; }
.rcard .who { font-size: 22px; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
.q-note { margin: 6px 0 0; color: var(--ny-soft); font-size: 14.5px; line-height: 1.5; }
.excerpt { font-family: var(--font-reading); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px; margin-top: 16px; font-size: 16px; line-height: 1.6; color: var(--text); }
.ex-line { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 14px; padding: 5px 0; color: var(--ny-soft); }
.excerpt.no-time .ex-line { grid-template-columns: minmax(0, 1fr); }
.ex-line.hit { color: var(--text); }
.ex-time { font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 3px; white-space: nowrap; color: var(--ny-soft); }

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WORDS = ["no","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];
const words = n => n < WORDS.length ? WORDS[n] : String(n);
const plural = (n, one, many) => `${words(n)} ${n === 1 ? one : (many || one + "s")}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const split = v => (v || "").split(";").map(x => x.trim()).filter(Boolean);
const client = code => S.clients.find(c => c.code === code);
const company = code => S.companies.find(c => c.code === code);
const label = code => { const c = client(code); if (c) return c.full_name; const o = company(code); return o ? split(o.names)[0] : code; };
const codesOf = call => (call.codes || "").split(",").filter(Boolean);

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET",
    headers: { "X-Token": TOKEN, "X-Page": PAGE_ID, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { let m = "Something went wrong."; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
// undo = {id, label} from a one-click decision: the pop-up offers Undo for 10 seconds, and waits while the mouse is on it.
function toast(msg, undo) {
  const t = document.getElementById("toast"), canUndo = !!(undo && undo.id);
  t.innerHTML = `<span>${esc(msg)}</span>` + (canUndo ? `<button type="button" class="toast-undo" data-undo="${undo.id}">Undo</button>` : "");
  t.classList.toggle("has-undo", canUndo); t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(hideToast, canUndo ? 10000 : 4200);
}
function hideToast() { document.getElementById("toast").classList.remove("show", "has-undo"); }
function undoDecision(id) {
  return act(async () => { const r = await api("/api/undo", { id }); hideToast();
    finalCheck = { file: null, stamp: null, items: null }; take({ state: r.state }); toast(r.message); });
}
function busy(on) { document.getElementById("busy").classList.toggle("show", on); }
async function act(fn) { busy(true); try { await fn(); } catch (e) { toast(e.message); } finally { busy(false); } }

function summaryText(s) {
  if (!s) return "";
  const parts = [];
  if (s.cleaned) parts.push(`cleaned ${plural(s.cleaned, "call")}`);
  if (s.held) parts.push(`holding ${plural(s.held, "call")} for you`);
  if (!parts.length) return s.decided ? "Saved." : "Nothing new to clean.";
  const waiting = (s.new_names || 0) + (s.ambiguous || 0);
  return cap(parts.join(", ")) + "." + (waiting ? ` ${cap(plural(waiting, "name"))} need${waiting === 1 ? "s" : ""} you.` : "") + (s.export_failed ? ` ${cap(plural(s.export_failed, "export"))} failed. Check the call details.` : "");
}

// After a save on Review names: say what changed in plain words (the originals are never touched).
function savedText(s) {
  const n = (s && s.cleaned) || 0, waiting = s ? (s.new_names || 0) + (s.ambiguous || 0) : 0;
  return "Saved." + (n ? ` Updated the clean ${n === 1 ? "copy of 1 call" : `copies of ${n} calls`}.` : "")
    + (waiting ? ` ${cap(plural(waiting, "name"))} still to review.` : "")
    + (s && s.export_failed ? ` ${cap(plural(s.export_failed, "export"))} failed. Check the call details.` : "");
}

function openIdentity(r, action = "new") {

  if (sg.company_names && split(sg.company_names.replace(/,/g, ";")).some(n => new RegExp(`(^|[^\\w])${escRe(n)}(?![\\w])`, "i").test(hitText(r)))) sg.company_code = "";

}

function identityEditor() {

  const next = S.next_codes?.[noun] || (person ? "C###" : "O###"), path = actionPath(d.action);
  const pool = person ? S.clients.map(c => [c.code, c.full_name]) : S.companies.map(c => [c.code, split(c.names)[0]]);
  const options = pool.map(([code, name]) => `<option value="${code}" ${d.code === code ? "selected" : ""}>${esc(name)} (${code})</option>`).join("");
  const paths = d.correction ? [["save", `Use a saved ${noun}`], ["hide", "Hide it"]] : [["save", "Save it"], ["hide", "Hide it"], ["keep", "Leave visible"]];
  const sub = {
    save: d.correction ? [["link_call", `A saved ${noun}, this call only`, "Only this call changes. The saved record stays as it is."]] : [

    hide: d.correction ? [["hide_call", "This call only", `Becomes ${hidden} here.`]] : [

  if (!person && path === "save" && !d.correction) sub[1][1] = "A company already saved";
  const seg = (cls, name, label, list, value) => `<div class="ie-row"><span class="ie-label" id="${cls}-label">${label}</span>

  const dup = person ? S.clients.some(c => c.full_name.toLowerCase() === String(d.full_name || "").trim().toLowerCase())
    : S.companies.some(c => split(c.names).some(n => split(String(d.names || "").replace(/,/g, ";")).some(m => m.toLowerCase() === n.toLowerCase())));
  const contacts = person && d.action === "new" ? `<details class="ie-more full" ${d.emails || d.phones ? "open" : ""}><summary>Add an email or phone number (optional)</summary>

    d.action === "new" && !person ? `<label class="full">Company name and short names<input name="names" value="${esc(d.names)}" required><span class="hint">The full name and any short forms, separated by commas.</span></label>` : "",

async function filesFromDrop(dt) {
  const out = [];
  const walk = entry => new Promise(res => {
    if (entry.isFile) entry.file(f => { out.push(f); res(); }, () => res());
    else if (entry.isDirectory) {
      const reader = entry.createReader(); const all = [];
      const read = () => reader.readEntries(async ents => {
        if (!ents.length) { await Promise.all(all.map(walk)); res(); } else { all.push(...ents); read(); } }, () => res());
      read();
    } else res();
  });
  const entries = [...dt.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) await Promise.all(entries.map(walk)); else out.push(...dt.files);
  return out;
}

      ${S.hold_unknown || !allIds.length ? "" : `<button class="btn" data-rv-hide="${allIds.join(",")}">Keep all ${words(sorted.length)} hidden</button>`}</div>
    ${ownerBox}

function rvKey(r) { return JSON.stringify([r.kind, r.name.toLowerCase(), r.candidates || ""]); }

function rvProgress(groups) {

function reviewGroups() {
  const groups = new Map();
  for (const r of S.review) {
    const key = JSON.stringify([r.kind, r.name.toLowerCase(), r.candidates || '']);
    if (!groups.has(key)) groups.set(key, {...r, group_ids:[], group_files:[]});
    const g = groups.get(key); g.group_ids.push(r.id); g.group_files.push({id:r.id, file:r.file, context:r.context, excerpt:r.excerpt, excerpt_more:r.excerpt_more});

}
function selectedReviewIds(r) {

  return (r.group_ids || [r.id]).filter(id => !chosen || chosen.has(id));
}
function groupContexts(r, selectable = false) {
  const more = nyMore.has(r.id);

}

const DOC_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function highlight(ctx, name) {
  const safe = esc(ctx), n = escRe(esc(name));
  return safe.replace(new RegExp(`(^|[^\\w])(${n})(?![\\w])`, "gi"), "$1<mark>$2</mark>");
}
// The transcript lines around a mention: time, speaker, words. Falls back to the plain snippet.
function excerptHtml(ex, name, fallback) {
  if (!ex?.lines?.length) return fallback ? `<div class="excerpt"><div class="ex-line hit"><div class="ex-body">${highlight(fallback, name)}</div></div></div>` : "";
  const timed = ex.lines.some(l => l.time);
  return `<div class="excerpt${timed ? "" : " no-time"}">${ex.lines.map(l => `<div class="ex-line${l.hit ? " hit" : ""}">${timed ? `<span class="ex-time">${esc(l.time)}</span>` : ""}<div class="ex-body">${l.speaker ? `<span class="ex-speaker">${highlight(l.speaker, name)}</span>` : ""}${highlight(l.text, name)}</div></div>`).join("")}</div>`;
}
// The mentioned sentence as your agents would read it after this answer. token null = left as written.
function outcome(src, name, token, room = 34) {
  if (!src) return "";
  const re = new RegExp(`(^|[^\\w])(${escRe(name)})(?![\\w])`, "i"), m = re.exec(src);
  if (!m) return "";
  const at = m.index + m[1].length, end = at + m[2].length;
  let a = Math.max(0, at - room), b = Math.min(src.length, end + room + 10);
  const sp = src.indexOf(" ", a), sp2 = src.lastIndexOf(" ", b);
  if (a && sp >= 0 && sp < at) a = sp + 1;
  if (b < src.length && sp2 > end) b = sp2;
  const piece = src.slice(a, b), all = new RegExp(`(^|[^\\w])(${escRe(name)})(?![\\w])`, "gi");
  let html = "", last = 0;
  for (const x of piece.matchAll(all)) {
    const s = x.index + x[1].length;
    html += esc(piece.slice(last, s)) + (token === null ? `<span class="kept">${esc(x[2])}</span>` : `<span class="tok">${esc(token)}</span>`);
    last = s + x[2].length;
  }
  return (a ? "…" : "") + html + esc(piece.slice(last)) + (b < src.length ? "…" : "");
}
const hitText = r => r.excerpt?.lines?.find(l => l.hit)?.text || (r.context || "").replace(/^\.\.\.|\.\.\.$/g, "");
const displayName = n => n === n.toLowerCase() ? n.replace(/(^|[\s'-])(\p{L})/gu, (_, a, b) => a + b.toUpperCase()) : n;
function choice({ attrs, title, desc, preview, primary }) {
  return `<button type="button" class="choice${primary ? " primary" : ""}" ${attrs}>
    <span class="choice-text"><span class="choice-title">${title}</span><span class="choice-desc">${desc}</span></span>
    ${preview ? `<span class="choice-preview"><span class="sr-only">Your agents read: </span><span class="pv-text">${preview}</span></span>` : ""}</button>`;
}

function reviewCard(r, groups = []) {
  const many = r.group_ids?.length > 1, name = displayName(r.name), src = hitText(r);
  const mentions = r.excerpt?.mentions > 1 ? ` · said ${words(r.excerpt.mentions)} times` : "";
  const chip = { unknown: ["k-person", "New person"], company: ["k-company", "New company"], ambiguous: ["k-which", "Which client?"] }[r.kind];
  const head = `<div class="q-head"><span class="chip ${chip[0]}"><span class="dot"></span>${chip[1]}</span>
    <span class="q-where">${many ? `In ${plural(r.group_ids.length, "call")}` : `${DOC_ICON}<span>${esc(r.file)}${mentions}</span>`}</span></div>`;
  const more = nyMore.has(r.id), hasMore = many || (r.excerpt_more?.lines?.length || 0) > (r.excerpt?.lines?.length || 0);
  const where = (many ? `<div class="hint ny-caution">The same name isn't always the same person. Check each call.</div>${groupContexts(r, r.kind === 'ambiguous')}`
    : excerptHtml(more ? r.excerpt_more : r.excerpt, r.name, r.context))
    + (hasMore ? `<button type="button" class="link-btn" data-ny-more="${r.id}" aria-expanded="${more}">${more ? "Show less" : "Show more of the call"}</button>` : "");
  const card = (question, body, note = "") => `<article class="card rcard" data-q="${r.id}">${head}<h2 class="who">${question}</h2>${note}${where}${body}</article>`;
  if (identityDraft && identityDraft.review_id === r.id) return card(r.kind === "ambiguous" ? `Which ${esc(cap(r.name))} is this?` : `Should ${esc(name)} be hidden?`, identityEditor());
  if (r.kind === "ambiguous") {
    const codes = r.candidates.split(" or ");
    const who = code => { const c = client(code), co = c?.company_code ? label(c.company_code) : ""; return [code, co, c ? plural(c.calls, "call") : ""].filter(Boolean).join(" · "); };
    const someone = choice({ attrs: `data-decide="${r.id}" data-value="person"`, title: codes.length === 1 ? "No, someone else" : "Someone else",
      desc: `Hidden as [PERSON] in ${many ? "the ticked calls" : "this call"}. Nothing is saved.`, preview: outcome(src, r.name, "[PERSON]") });
    if (codes.length === 1) return card(`Is this ${esc(label(codes[0]))}?`,
      `<div class="choices"><div class="choices-head" aria-hidden="true"><span>Your answer</span><span>What your agents read</span></div>${choice({ attrs: `data-decide="${r.id}" data-value="${codes[0]}"`, title: `Yes, it's ${esc(label(codes[0]))}`, desc: esc(who(codes[0])), preview: outcome(src, r.name, codes[0]), primary: true })}${someone}</div>`,
      `<p class="q-note">A common first name isn't assumed to be your client. Your answer only applies to ${many ? "the ticked calls" : "this call"}.</p>`);
    return card(`Which ${esc(cap(r.name))} is this?`,
      `<div class="choices"><div class="choices-head" aria-hidden="true"><span>Your answer</span><span>What your agents read</span></div>${codes.map(code => choice({ attrs: `data-decide="${r.id}" data-value="${code}"`, title: esc(label(code)), desc: esc(who(code)), preview: outcome(src, r.name, code) })).join("")}${someone}</div>`,
      `<p class="q-note">More than one of your clients has this first name. Your answer only applies to ${many ? "the ticked calls" : "this call"}.</p>`);
  }
  const isCo = r.kind === "company", noun = isCo ? "company" : "person", hidden = isCo ? "[COMPANY]" : "[PERSON]";
  // A person and their company often arrive together ("Derek Olsen from Olsen Builds"): say so, so one answer covers both.
  const coNames = split((r.suggestions?.company_names || "").replace(/,/g, ";")).map(s => s.toLowerCase());
  const partner = isCo
    ? groups.find(g => g.kind === "unknown" && g.file === r.file && split((g.suggestions?.company_names || "").replace(/,/g, ";")).some(s => s.toLowerCase() === r.name.toLowerCase()))
    : groups.find(g => g.kind === "company" && g.file === r.file && coNames.includes(g.name.toLowerCase()));
  const note = partner ? `<p class="q-note">${isCo
    ? `Mentioned with ${esc(displayName(partner.name))}, who is also waiting. Saving ${esc(displayName(partner.name))} can add this company in the same step.`
    : `${esc(partner.name)} is waiting too. Saving ${esc(name)} can add it as their company in the same step.`}</p>` : "";
  return card(`Should ${esc(name)} be hidden?`, `<div class="choices"><div class="choices-head" aria-hidden="true"><span>Your answer</span><span>What your agents read</span></div>
    ${choice({ attrs: `data-identity="${r.id}"`, title: `Save as a ${noun}`, primary: true,
      desc: `Gets the code ${S.next_codes?.[isCo ? "company" : "person"] || (isCo ? "O###" : "C###")} in every call, now and later. Or link one you've already saved.`,
      preview: outcome(src, r.name, S.next_codes?.[isCo ? "company" : "person"] || (isCo ? "O###" : "C###")) })}
    ${choice({ attrs: `data-identity="${r.id}" data-identity-action="hide_call"`, title: many ? "Hide in some calls only" : "Hide in this call only",
      desc: many ? "Choose the calls next. Nothing is saved." : "Nothing is saved, so other calls aren't affected.", preview: outcome(src, r.name, hidden) })}
    ${choice({ attrs: `data-identity="${r.id}" data-identity-action="keep"`, title: "Leave it visible",
      desc: isCo ? "For a public brand, a tool, or a word that isn't a company. You'll confirm next." : "For you, a public figure, or a word that isn't a name. You'll confirm next.", preview: outcome(src, r.name, null) })}
  </div>`, note);
}

const AGENT_NOTE = "Transcripts use codes instead of real names: C001 is a person, O001 is a company, C001-EMAIL and C001-PHONE are their email and phone, EMAIL-1 or PHONE-1 is a one-off contact, and PERSON-1 or COMPANY-1 is a name hidden without a saved record (the same code means the same name in every call). Keep every code exactly as written in anything you draft, including emails and documents. Never guess who a code is.";

async function uploadTheme(file) {
  if (!file || !file.name.toLowerCase().endsWith(".md")) { toast("That isn't a design.md file."); return; }
  await act(async () => { const r = await api("/api/theme", { text: await file.text() }); S = r.state; reloadTheme(); render(); toast(`Now using ${r.name}.`); });
}
function reloadTheme() { document.getElementById("theme-css").href = "/theme.css?v=" + Date.now(); }

// ---------- settings ----------
// Updates: goes online only when clicked. upd = null | {busy} | the last check or update result
let upd = null;
function updatesCard() {
  const r = upd || {};
  let hint = "Get the newest version without downloading it again. Your calls, clients and settings stay as they are.";
  let button = `<button class="btn" data-action="update-check">Check for updates</button>`;
  if (S.developer_copy) { hint = "This is a developer copy (a git folder), so it updates with git, not from here."; button = ""; }
  else if (r.busy) { hint = r.busy; button = ""; }
  else if (r.updated) { hint = r.message; button = `<button class="btn primary" data-action="update-restart">Restart now</button>`; }
  else if (r.available) { hint = `${r.message} Your calls, clients and settings stay as they are.`; button = `<button class="btn primary" data-action="update-apply">Update now</button>`; }
  else if (r.message) { hint = r.message; }
  return `<div class="card panel" id="updates"><h2>Updates</h2>
      <div class="tool-row"><div><b>Version ${esc(S.version || "1.0.0")}</b><div class="hint">${esc(hint)}</div></div>${button}</div></div>`;
}
function paintUpdates() { const box = document.getElementById("updates"); if (box) box.outerHTML = updatesCard(); }
async function updateAction(kind) {
  if (kind === "check") {
    upd = { busy: "Checking for a newer version..." }; paintUpdates();
    try { upd = await api("/api/update-check", {}); } catch (e) { upd = { message: e.message }; }
  } else if (kind === "apply") {
    upd = { busy: "Updating. This can take a minute; don't close the app." }; paintUpdates();
    try { const r = await api("/api/update-apply", {}); upd = { updated: true, message: r.message }; }
    catch (e) { upd = { message: e.message }; }
  } else if (kind === "restart") {
    upd = { busy: "Restarting..." }; paintUpdates();
    try { await api("/api/restart", {}); } catch (e) { upd = { updated: true, message: e.message }; }
  }
  paintUpdates();
}

  if (e.target.dataset.hide) {
    const k = e.target.dataset.hide, on = e.target.checked;
    const what = { people: "people's names", companies: "company names", emails: "email addresses", phones: "phone numbers" }[k];
    if (!on && !confirm(`Turn this off and ${what} will stay as written in the clean copies your agents read. Every clean copy is updated. Continue?`)) {
      e.target.checked = true; return;
    }
    return act(async () => take(await api("/api/hide", { [k]: on })));
  }
  if (e.target.id === "picker") uploadFiles([...e.target.files]);
  if (e.target.id === "theme-picker") uploadTheme(e.target.files[0]);
  if (e.target.id === "logo-picker" && e.target.files[0]) squareLogo(e.target.files[0])
    .then(d => { const name = document.querySelector("#brand-form [name=name]")?.value; logoDraft = d; render();
      if (name !== undefined) document.querySelector("#brand-form [name=name]").value = name; })
    .catch(err => toast(err.message));
  if (e.target.dataset.same && e.target.value) act(async () => take(await api("/api/decide", { id: +e.target.dataset.same, decision: e.target.value })));
});
document.addEventListener("input", e => {
  if (e.target.dataset.sgField) { const m = e.target.dataset.sgEmail, s = S.suggested_people.find(x => x.email === m);
    sgEdits.set(m, { ...sgRow(s), [e.target.dataset.sgField]: e.target.value }); return; }
  if (e.target.id === "bulk-text") { bulkText = e.target.value; return; }
  if (e.target.id === "restore-in") { restoreIn = e.target.value; clearTimeout(restoreTimer); restoreTimer = setTimeout(runRestore, 250); return; }
  if (!e.target.closest('#identity-form') || !identityDraft) return;
  if (e.target.id === 'identity-search') {
    const query = e.target.value.toLowerCase();
    for (const option of document.querySelectorAll('#identity-form [name=code] option')) option.hidden = !!option.value && !option.textContent.toLowerCase().includes(query);
    return;
  }
  identityDraft[e.target.name] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, data = Object.fromEntries(new FormData(f));
  if (f.id === "merge-form") {
    if (!confirm(`Merge ${label(data.remove)} (${data.remove}) into ${label(f.dataset.keep)} (${f.dataset.keep})? Identifiers are combined, ${data.remove} is removed, and calls are checked again.`)) return;
    return act(async () => { const r = await api('/api/merge', { keep: f.dataset.keep, remove: data.remove }); formDrafts.clear(); skipDraftCapture = true; take(r); });
  }
  if (f.id === "identity-form") return act(async () => {
    const d = { ...identityDraft, ...data, distinct: !!data.distinct };
    delete d.path; delete d.source; delete d.group_files;
    if (['hide_call', 'link_call'].includes(d.action) && d.review_ids.length) {
      d.review_ids = selectedReviewIds({id:d.review_id, group_ids:d.review_ids});
      if (!d.review_ids.length) throw new Error('Select at least one call.');
    }
    if (d.company_code === "__new__") d.company_code = ""; else d.company_names = "";
    const r = await api("/api/identity", d); identityDraft = null; take({ state: r.state }); toast(savedText(r.summary), r.undo); focusQuestion();
  });
  if (f.id === "client-form" || f.id === "company-person-form") act(async () => { const r = await api("/api/client", { ...data, code: f.dataset.code });
    rememberDrafts(); formDrafts.delete(draftKey(f)); skipDraftCapture = true; S = r.state;
    if (f.dataset.companyContext) { selCompany = f.dataset.companyContext; companyPerson = null; } else selClient = r.code;
    render(); toast("Saved. Clean copies that mention them are updated."); });
  if (f.id === "company-form") act(async () => { const r = await api("/api/company", { ...data, code: f.dataset.code });
    rememberDrafts(); formDrafts.delete(draftKey(f)); skipDraftCapture = true; S = r.state; selCompany = r.code; render(); toast("Saved. Clean copies that mention them are updated."); });
  if (f.id === "company-link-person") return act(async () => {
    const p = client(data.person_code); if (!p || p.company_code) throw new Error("Choose a person who is not linked to a company.");
    const r = await api("/api/client", { ...p, company_code: f.dataset.companyCode });
    S = r.state; render(); toast("Person linked. Affected calls have been checked again.");
  });
  if (f.id === "allow-form") act(async () => take(await api("/api/allow", { add: data.add })));
  if (f.id === "fathom-dates") return loadFathom({ range: "dates", from: data.from, to: data.to || data.from },
    data.to && data.to !== data.from ? `${data.from} to ${data.to}` : data.from);
  if (f.id === "team-form") return act(async () => { const r = await api("/api/team", { add: data.add }); take(r); toast(r.message); });
  if (f.id === "owner-form") return act(async () => { const r = await api("/api/owner", { name: data.name }); take({ state: r.state }); toast(r.message, r.undo); });
  if (f.id === "fathom-form" || f.id === "granola-form") act(async () => { const r = await api(`/api/${f.id.split("-")[0]}`, { key: data.key }); S = r.state; render(); toast(r.message); });
  if (f.dataset.renameForm) {
    const from = f.dataset.renameForm;
    return act(async () => { const r = await api("/api/rename-call", { file: from, to: data.to });
      if (selCall === from) selCall = r.file; renaming = null; S = r.state; render(); toast(r.message); });
  }
  if (f.id === "brand-form") act(async () => {
    const r = await api("/api/brand", { name: data.name, ...(logoDraft ? { logo: logoDraft } : {}) });
    logoDraft = null; S = r.state; render();
    toast("Saved. If you made a desktop shortcut, add it again from Settings to pick up the new name and icon.");
  });
  if (f.id === "paste-form") {
    let name = (data.name || pasteName()).trim();
    if (!/\.(txt|md|vtt|srt)$/i.test(name)) name += ".txt";
    if (!data.text.trim()) return toast("Paste a transcript first.");
    act(async () => { const r = await api("/api/upload", { files: [{ name, text: data.text }] });
      pasting = false; pastedText = ""; selCall = r.added_files?.[0] || name; take(r); });
  }
});
// Ctrl+V anywhere on the Calls screen (outside a text box) opens the paste form with the text in it
document.addEventListener("paste", e => {
  if (view !== "calls" || e.target.closest("input, textarea")) return;
  const text = e.clipboardData.getData("text/plain");
  if (!text.trim()) return;
  e.preventDefault();
  pasting = true; pastedText = text; render();
  toast("Pasted. Check the name, then click Clean it.");
});
// drag and drop anywhere on the window
let depth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); depth++; document.getElementById("drop")?.classList.add("over"); });
window.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; document.getElementById("drop")?.classList.remove("over"); } });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", async e => {
  e.preventDefault(); depth = 0; document.getElementById("drop")?.classList.remove("over");
  const files = await filesFromDrop(e.dataTransfer);
  if (view === "appearance") return uploadTheme(files[0]);
  if (view !== "calls") { view = "calls"; render(); }
  uploadFiles(files);
});
// heartbeat: the app stops itself a couple of minutes after this window closes
setInterval(() => api("/api/ping", {}).catch(() => {}), 20000);
// Closing the app window stops the app within a few seconds (a reload sends this too, and simply cancels it).
addEventListener("pagehide", () => { try { navigator.sendBeacon(`/api/bye?t=${encodeURIComponent(TOKEN)}&p=${PAGE_ID}`, "{}"); } catch (e) {} });
api("/api/ping", {}).catch(() => {});
refresh().catch(e => { document.getElementById("main").innerHTML = `<div class="note bad">Couldn't start: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
